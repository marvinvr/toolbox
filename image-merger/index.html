<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Merger</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js" integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB" crossorigin="anonymous"></script>
    <style type="text/tailwindcss">
      .drop-zone {
        @apply border-2 border-dashed border-gray-300 rounded-lg p-6 flex flex-col items-center justify-center text-gray-500 cursor-pointer transition-colors min-h-[180px];
      }
      .drop-zone:hover, .drop-zone.dragover {
        @apply border-blue-500 bg-blue-50 text-blue-600;
      }
      .drop-zone.has-image {
        @apply border-solid border-gray-300 p-1;
      }
    </style>
  </head>
  <body>
    <div class="flex flex-col items-center justify-center min-h-screen p-4 gap-8">
      <div class="flex flex-col items-center text-center mb-4">
        <h1 class="text-3xl font-bold mb-2">Image Merger</h1>
        <span class="text-gray-600 text-md">by <a href="https://marvinvr.ch" class="font-semibold hover:text-blue-500">marvinvr</a></span>
        <p class="text-gray-600 max-w-xl">
          Drop an image on each side, then click on the preview to place points that define your split line.
          Drag points to adjust, double-click to remove. Everything left of the line comes from the left image.
        </p>
      </div>

      <div class="flex gap-4 w-full max-w-2xl">
        <div class="flex-1 flex flex-col gap-2">
          <label class="text-sm font-medium">Left Image</label>
          <div class="drop-zone" id="leftDrop" onclick="document.getElementById('leftFile').click()">
            <svg class="w-8 h-8 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
            <span class="text-sm">Drop or click</span>
          </div>
          <input type="file" id="leftFile" accept="image/*" class="hidden" onchange="handleFile('left', this.files[0])">
        </div>
        <div class="flex-1 flex flex-col gap-2">
          <label class="text-sm font-medium">Right Image</label>
          <div class="drop-zone" id="rightDrop" onclick="document.getElementById('rightFile').click()">
            <svg class="w-8 h-8 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
            <span class="text-sm">Drop or click</span>
          </div>
          <input type="file" id="rightFile" accept="image/*" class="hidden" onchange="handleFile('right', this.files[0])">
        </div>
      </div>

      <div class="flex gap-3">
        <button
          onclick="clearPoints()"
          class="border border-gray-300 text-gray-700 py-2 px-4 rounded hover:bg-gray-50 transition-colors text-sm"
        >
          Clear Split Line
        </button>
        <button
          onclick="exportMerged()"
          class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600 transition-colors disabled:bg-gray-300 text-sm"
          id="exportBtn"
          disabled
        >
          Download Merged Image
        </button>
      </div>

      <div class="w-full max-w-4xl">
        <canvas
          id="mergeCanvas"
          width="1200"
          height="600"
          class="border border-gray-300 w-full cursor-crosshair"
        ></canvas>
      </div>
    </div>

    <script>
      let leftImage = null;
      let rightImage = null;
      let points = []; // {x, y} in canvas coordinates
      let draggingIndex = -1;
      const POINT_RADIUS = 7;
      const GRAB_RADIUS = 14;

      const canvas = document.getElementById('mergeCanvas');
      const ctx = canvas.getContext('2d');

      // --- Placeholder ---
      function drawPlaceholder() {
        ctx.fillStyle = '#f5f5f5';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#aaa';
        ctx.font = '22px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Drop images above to preview the merge', canvas.width / 2, canvas.height / 2);
      }
      drawPlaceholder();

      // --- Drag-and-drop for image upload ---
      ['left', 'right'].forEach(side => {
        const zone = document.getElementById(side + 'Drop');
        zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
        zone.addEventListener('dragleave', () => { zone.classList.remove('dragover'); });
        zone.addEventListener('drop', e => {
          e.preventDefault();
          zone.classList.remove('dragover');
          const file = e.dataTransfer.files[0];
          if (file && file.type.startsWith('image/')) handleFile(side, file);
        });
      });

      function handleFile(side, file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            if (side === 'left') leftImage = img;
            else rightImage = img;

            const zone = document.getElementById(side + 'Drop');
            zone.classList.add('has-image');
            zone.innerHTML = '<img src="' + e.target.result + '" class="w-full h-full object-cover rounded-md max-h-[170px]">';
            zone.onclick = () => document.getElementById(side + 'File').click();

            resizeCanvas();
            render();
            updateExportButton();
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }

      function resizeCanvas() {
        if (leftImage && rightImage) {
          const h = Math.max(leftImage.height, rightImage.height);
          const w = Math.max(leftImage.width, rightImage.width);
          const maxW = 2400, maxH = 1600;
          const scale = Math.min(1, maxW / w, maxH / h);
          canvas.width = Math.round(w * scale);
          canvas.height = Math.round(h * scale);
        } else if (leftImage) {
          const scale = Math.min(1, 2400 / leftImage.width, 1600 / leftImage.height);
          canvas.width = Math.round(leftImage.width * scale);
          canvas.height = Math.round(leftImage.height * scale);
        } else if (rightImage) {
          const scale = Math.min(1, 2400 / rightImage.width, 1600 / rightImage.height);
          canvas.width = Math.round(rightImage.width * scale);
          canvas.height = Math.round(rightImage.height * scale);
        }
      }

      // --- Split path logic ---
      function getSortedPoints() {
        return [...points].sort((a, b) => a.y - b.y);
      }

      function getSplitPath() {
        const sorted = getSortedPoints();
        if (sorted.length === 0) {
          // Default vertical split at 50%
          return [
            { x: canvas.width / 2, y: 0 },
            { x: canvas.width / 2, y: canvas.height }
          ];
        }
        const path = [];
        // Extend to top edge using the topmost point's x
        path.push({ x: sorted[0].x, y: 0 });
        for (const p of sorted) path.push(p);
        // Extend to bottom edge using the bottommost point's x
        path.push({ x: sorted[sorted.length - 1].x, y: canvas.height });
        return path;
      }

      // --- Drawing ---
      function drawCover(ctx, img, x, y, w, h) {
        const imgRatio = img.width / img.height;
        const canvasRatio = w / h;
        let sx, sy, sw, sh;
        if (imgRatio > canvasRatio) {
          sh = img.height;
          sw = sh * canvasRatio;
          sx = (img.width - sw) / 2;
          sy = 0;
        } else {
          sw = img.width;
          sh = sw / canvasRatio;
          sx = 0;
          sy = (img.height - sh) / 2;
        }
        ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
      }

      function drawMerge() {
        const cw = canvas.width;
        const ch = canvas.height;
        const splitPath = getSplitPath();

        ctx.clearRect(0, 0, cw, ch);

        // Left image: clipped to left of split path
        if (leftImage) {
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(0, 0);
          for (const p of splitPath) ctx.lineTo(p.x, p.y);
          ctx.lineTo(0, ch);
          ctx.closePath();
          ctx.clip();
          drawCover(ctx, leftImage, 0, 0, cw, ch);
          ctx.restore();
        } else {
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(0, 0);
          for (const p of splitPath) ctx.lineTo(p.x, p.y);
          ctx.lineTo(0, ch);
          ctx.closePath();
          ctx.fillStyle = '#e5e5e5';
          ctx.fill();
          ctx.restore();
        }

        // Right image: clipped to right of split path
        if (rightImage) {
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(splitPath[0].x, splitPath[0].y);
          ctx.lineTo(cw, 0);
          ctx.lineTo(cw, ch);
          ctx.lineTo(splitPath[splitPath.length - 1].x, splitPath[splitPath.length - 1].y);
          for (let i = splitPath.length - 2; i >= 0; i--) {
            ctx.lineTo(splitPath[i].x, splitPath[i].y);
          }
          ctx.closePath();
          ctx.clip();
          drawCover(ctx, rightImage, 0, 0, cw, ch);
          ctx.restore();
        } else {
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(splitPath[0].x, splitPath[0].y);
          ctx.lineTo(cw, 0);
          ctx.lineTo(cw, ch);
          ctx.lineTo(splitPath[splitPath.length - 1].x, splitPath[splitPath.length - 1].y);
          for (let i = splitPath.length - 2; i >= 0; i--) {
            ctx.lineTo(splitPath[i].x, splitPath[i].y);
          }
          ctx.closePath();
          ctx.fillStyle = '#e5e5e5';
          ctx.fill();
          ctx.restore();
        }
      }

      function drawUI() {
        const splitPath = getSplitPath();

        // Draw split line
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(splitPath[0].x, splitPath[0].y);
        for (let i = 1; i < splitPath.length; i++) {
          ctx.lineTo(splitPath[i].x, splitPath[i].y);
        }
        ctx.strokeStyle = 'rgba(0,0,0,0.5)';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.restore();

        // Draw points
        for (const p of points) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, POINT_RADIUS, 0, Math.PI * 2);
          ctx.fillStyle = 'white';
          ctx.fill();
          ctx.strokeStyle = '#333';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      }

      function render() {
        if (!leftImage && !rightImage) { drawPlaceholder(); return; }
        drawMerge();
        drawUI();
      }

      // --- Canvas interaction ---
      function getCanvasPos(e) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (e.clientX - rect.left) * (canvas.width / rect.width),
          y: (e.clientY - rect.top) * (canvas.height / rect.height)
        };
      }

      function findPointNear(pos) {
        for (let i = 0; i < points.length; i++) {
          const dx = points[i].x - pos.x;
          const dy = points[i].y - pos.y;
          if (Math.sqrt(dx * dx + dy * dy) < GRAB_RADIUS) return i;
        }
        return -1;
      }

      canvas.addEventListener('mousedown', e => {
        if (!leftImage && !rightImage) return;
        const pos = getCanvasPos(e);
        const idx = findPointNear(pos);
        if (idx >= 0) {
          draggingIndex = idx;
          canvas.style.cursor = 'grabbing';
        } else {
          points.push({ x: pos.x, y: pos.y });
          draggingIndex = points.length - 1;
          render();
        }
      });

      canvas.addEventListener('mousemove', e => {
        if (draggingIndex < 0) {
          // Update cursor
          const pos = getCanvasPos(e);
          canvas.style.cursor = findPointNear(pos) >= 0 ? 'grab' : 'crosshair';
          return;
        }
        const pos = getCanvasPos(e);
        points[draggingIndex].x = Math.max(0, Math.min(canvas.width, pos.x));
        points[draggingIndex].y = Math.max(0, Math.min(canvas.height, pos.y));
        render();
      });

      canvas.addEventListener('mouseup', () => {
        draggingIndex = -1;
        canvas.style.cursor = 'crosshair';
      });

      canvas.addEventListener('mouseleave', () => {
        draggingIndex = -1;
      });

      canvas.addEventListener('dblclick', e => {
        const pos = getCanvasPos(e);
        const idx = findPointNear(pos);
        if (idx >= 0) {
          points.splice(idx, 1);
          render();
        }
      });

      function clearPoints() {
        points = [];
        render();
      }

      function updateExportButton() {
        document.getElementById('exportBtn').disabled = !(leftImage && rightImage);
      }

      function exportMerged() {
        if (!leftImage || !rightImage) return;
        // Draw without UI, export, then redraw with UI
        drawMerge();
        const link = document.createElement('a');
        link.download = 'merged-image.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        render();
      }
    </script>
  </body>
</html>
